site_name: PlexusHive
site_description: Work identities, decisions and messages for coordinating long-lived coding agents
site_url: https://plexusone.github.io/plexushive/
repo_url: https://github.com/plexusone/plexushive
repo_name: plexusone/plexushive

theme:
  name: material
  custom_dir: docs/overrides
  palette:
    # Dark mode first (PlexusOne default)
    - scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
    - scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - search.highlight
    - content.code.copy

extra_css:
  - https://plexusone.dev/css/plexusone-mkdocs.css

markdown_extensions:
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.tabbed:
      alternate_style: true
  - admonition
  - pymdownx.details
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Getting Started:
      - Installation: getting-started/installation.md
      - Quick Start: getting-started/quickstart.md
  - User Guide: guides/user-guide.md
  - Reference:
      - Work identities: reference/identities.md
      - Decisions: reference/decisions.md
      - Open Items: reference/open-items.md
      - Status Reports: reference/reports.md
      - Messages: reference/messages.md
      - CLI: reference/cli.md
      - JSON Schemas: reference/schemas.md
  - API Reference: https://pkg.go.dev/github.com/plexusone/plexushive/hive
  - Releases:
      - Changelog: releases/changelog.md
      - v0.6.0: releases/v0.6.0.md
      - v0.5.0: releases/v0.5.0.md
      - v0.4.1: releases/v0.4.1.md
      - v0.4.0: releases/v0.4.0.md
      - v0.3.0: releases/v0.3.0.md
      - v0.2.0: releases/v0.2.0.md
      - v0.1.0: releases/v0.1.0.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/plexusone/plexushive
